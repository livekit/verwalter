# Reusable: the changeset check for a pull request. The calling job
# needs `contents: read` and `pull-requests: write`.
# A repository with `[check].api` keeps a workflow of its own, because
# the tool that the command names must be installed first.
name: Changeset check (reusable)

on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The action at the commit of this workflow file, so one pin in the
      # caller sets the version of both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .verwalter-action
      - run: echo .verwalter-action >> .git/info/exclude
      - uses: ./.verwalter-action
        with:
          command: check

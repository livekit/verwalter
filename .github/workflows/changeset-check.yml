name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # This repo builds the tool from source instead of using the action.
      - run: cargo run --quiet -- check --pr "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}

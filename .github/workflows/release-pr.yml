name: Release PR

on:
  push:
    branches: [main]

# The verwalter-release App token does the writes.
permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      # Pushes and PRs made with github.token start no workflows, so the
      # release PR would get no CI. The App token does not have this limit.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }} # git push uses it
      - uses: ./.github/actions/setup-devenv
      - shell: devenv shell -- bash -e {0}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cargo run --quiet -- pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual run for a version that is in Cargo.toml but not tagged yet,
  # such as the very first release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build first: nothing is written anywhere until the binaries exist.
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: tar -C target/release -czf "verwalter-${{ matrix.target }}.tar.gz" verwalter
      - uses: actions/upload-artifact@v4
        with:
          name: verwalter-${{ matrix.target }}
          path: verwalter-${{ matrix.target }}.tar.gz

  # Then tag and create the release with the assets attached, in one step.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --quiet -- release --asset dist/verwalter-x86_64-unknown-linux-gnu.tar.gz --asset dist/verwalter-aarch64-unknown-linux-gnu.tar.gz --asset dist/verwalter-aarch64-apple-darwin.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual run for a version that is in Cargo.toml but not tagged yet,
  # such as the very first release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # crates.io trusted publishing

jobs:
  # Build first: nothing is written anywhere until the binaries exist.
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo build --release --locked
      - run: tar -C target/release -czf "verwalter-${{ matrix.target }}.tar.gz" verwalter
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verwalter-${{ matrix.target }}
          path: verwalter-${{ matrix.target }}.tar.gz

  # Then tag and create the release with the assets attached, in one step.
  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - id: verwalter
        run: cargo run --quiet -- release --asset dist/verwalter-x86_64-unknown-linux-gnu.tar.gz --asset dist/verwalter-aarch64-unknown-linux-gnu.tar.gz --asset dist/verwalter-aarch64-apple-darwin.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  # Last, because it cannot be undone: publish the crate, through the
  # tool's own `publish`. Trusted publishing (no stored token) must be
  # configured on crates.io for this repository and workflow.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # tags decide what is published
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo run --quiet -- publish --releases '${{ needs.release.outputs.releases }}'
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

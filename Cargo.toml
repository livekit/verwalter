[package]
name = "verwalter"
version = "0.28.1"
edition = "2024"
description = "Changeset-based versioning for single packages and monorepos"
license = "Apache-2.0"
repository = "https://github.com/livekit/verwalter"
readme = "README.md"
keywords = ["changesets", "versioning", "release", "monorepo", "semver"]
categories = ["development-tools", "command-line-utilities"]
# The crate is the tool; the spec, the action and the workflows stay in git.
include = ["/src/**", "/Cargo.toml", "/README.md", "/CHANGELOG.md"]

# cargo binstall picks the binaries the release workflow attaches.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
# Versioned file formats (Cargo.toml, Cargo.lock, package.json, pyproject.toml,
# pubspec.yaml, go.mod, ...), format-preserving edits, semver with pre-releases.
knope-versioning = "0.8"
regex = "1"
relative-path = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"

[dev-dependencies]
schemars = "1"

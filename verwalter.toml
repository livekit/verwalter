#:schema ./schemas/v1.json
# verwalter versions itself.
[packages.verwalter]
path = "."
# The docs and the examples name the release to use. Each release
# moves them, so they always name the latest one.
versioning.files = [
  "Cargo.toml",
  "Cargo.lock",
  { path = "README.md", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "docs/action.md", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "docs/api-check.md", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "docs/release-workflows.md", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "examples/workflows/changeset-check.yml", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "examples/workflows/pre-release.yml", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "examples/workflows/release-pr.yml", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
  { path = "examples/workflows/release.yml", regex = '(?:livekit/verwalter@|--tag )v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)' },
]
release.draft = false                          # release.yml builds first and attaches the binaries on creation

[publish]
registry = "crates"
command = "cargo publish --locked"

[check]
publish_dry_run = "cargo publish --dry-run --locked"   # the release PR tries the publish command
# The changeset level is the contributor's claim; cargo-semver-checks compares
# the library API against the baseline and fails a claim that is too low.
# The baseline is the base of the PR, not the last release tag. A changeset
# makes a claim for the changes of its own PR. Against the tag, a breaking
# change that is on `main` and not released would count against each later
# PR for the same crate.
# No `pipefail`: the tool exits with 100 for a finding and 101 for a build
# failure, and verwalter takes an exit code that is not 0 as a failed check.
api = "cargo semver-checks --baseline-rev $(git merge-base origin/${GITHUB_BASE_REF:-main} HEAD) 2>&1 | tee /dev/stderr | sed -n 's/.*requires new \\([a-z]*\\) version.*/\\1/p'"

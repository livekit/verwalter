#:schema ./schemas/v1.json
# verwalter versions itself.
[packages.verwalter]
path = "."
versioning.files = ["Cargo.toml", "Cargo.lock"]
release.draft = false                          # release.yml builds first and attaches the binaries on creation

[publish]
registry = "crates"
command = "cargo publish --locked"

[check]
# The changeset level is the contributor's claim; cargo-semver-checks compares
# the library API against the last release and fails a claim that is too low.
api = "cargo semver-checks --baseline-rev $VERWALTER_BASELINE_TAG 2>&1 | tee /dev/stderr | sed -n 's/.*requires new \\([a-z]*\\) version.*/\\1/p'"

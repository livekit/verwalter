# After a release PR merges: build, then tag and create the GitHub release
# with the assets, then publish to the registry. The step that cannot be
# undone comes last. The tool stops at the tag and the release; publishing
# is this workflow's job, driven by the `releases` output.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Re-run by hand after a fix: `verwalter release` resumes from the
  # current state (tags, releases, assets) and skips what is done. With
  # `package`, that package is reported again even when complete, so the
  # publish job runs for it.
  workflow_dispatch:
    inputs:
      package:
        description: Only this package; always reported to the publish job.
        required: false
        default: ""

permissions:
  contents: write
  id-token: write # trusted publishing

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Build whatever the release needs: wheels, binaries, packages.
      - run: mkdir -p dist && echo "built" > dist/artifact.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - id: verwalter
        uses: lukasIO/verwalter@v0.10.0
        with:
          command: release
          # Attached to the GitHub release when it is created. Leave out
          # for packages with `draft = true`, whose assets are built later.
          args: --asset dist/artifact.txt ${{ inputs.package && format('--package {0}', inputs.package) || '' }}

  # `releases` lists dependencies before dependents, each with
  # `depends_on`. Publish in that order, one at a time, and stop at the
  # first failure: a dependent must not reach the registry before its
  # dependency, and not at all if the dependency failed.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        release: ${{ fromJSON(needs.release.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.release.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Replace with the registry publish for the language: cargo publish,
      # npm publish, pypa/gh-action-pypi-publish, ...
      # cargo, pip and pub keep pre-releases away from default resolution
      # by the version alone. npm does not: an rc published without a
      # dist-tag becomes `latest`, so pass one.
      # Registries index with a delay; a publish that resolves a dependency
      # released seconds ago may need a retry (cargo publish does this).
      - name: Publish ${{ matrix.release.package }} ${{ matrix.release.version }}
        run: |
          echo "publish ${{ matrix.release.package }} ${{ matrix.release.version }}"
          # npm publish --tag ${{ matrix.release.prerelease && 'next' || 'latest' }}

      # Only for packages with `draft = true`: attach assets built here,
      # then publish the GitHub release.
      - if: matrix.release.status == 'drafted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release upload "${{ matrix.release.tag }}" dist/*
          gh release edit "${{ matrix.release.tag }}" --draft=false

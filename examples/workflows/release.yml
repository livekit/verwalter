# After a release PR merges: build, then tag and create the GitHub release
# with the assets, then publish to the registry. The step that cannot be
# undone comes last. The tool stops at the tag and the release; publishing
# is this workflow's job, driven by the `releases` output.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Re-run by hand after a fix: `verwalter release` resumes from the
  # current state (tags, releases, assets) and skips what is done. With
  # `package`, that package is reported again even when complete, so the
  # publish job runs for it.
  workflow_dispatch:
    inputs:
      package:
        description: Only this package; always reported to the publish job.
        required: false
        default: ""

permissions:
  contents: write
  id-token: write # trusted publishing

jobs:
  build:
    # Only a release PR the tool opened: the branch prefix alone would let
    # any pushed `release/*` branch trigger a publish. The author is the
    # GitHub App of `app-client-id`. Without an App, it is github-actions[bot].
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.user.login == 'verwalter-release[bot]' && contains(github.event.pull_request.body, '<!-- verwalter release -->'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # Build whatever the release needs: wheels, binaries, packages.
      # A matrix build gives each job its own artifact name, such as
      # `dist-${{ matrix.target }}`, and the release job downloads them
      # all with `pattern: dist-*` and `merge-multiple: true`.
      - run: mkdir -p dist && echo "built" > dist/artifact.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.verwalter.outputs.released }}
      releases: ${{ steps.verwalter.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit itself: a push to main right after the merge
          # must not move the tags.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - id: verwalter
        uses: livekit/verwalter@v0.22.0
        with:
          command: release
          # Every file in dist/ is attached to the GitHub release when it
          # is created. Not a glob: `dist/*` would expand to several
          # arguments. Leave out for packages with `release.draft = true`,
          # whose assets are built later.
          args: --asset dist ${{ inputs.package && format('--package {0}', inputs.package) || '' }}

  # `publish` runs each package's publish command from verwalter.toml
  # (`[publish]` defaults, `publish.registry` and `publish.command` per package) for the
  # packages this run released, dependencies first, independent packages
  # in parallel. A failure blocks the transitive dependents and nothing
  # else. A version the registry already has is skipped, so a re-run of
  # this job is safe. Without `releases`, or with the empty list a re-run
  # by hand gets when the release step had nothing left to do, every
  # tagged package is run, and the registry check skips what is there.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # drafts: gh release upload and edit
      id-token: write   # trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0  # tags decide what is published
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Set up the registry tooling the commands need: setup-node with
      # registry-url for npm provenance, cargo login, twine, ...
      # For packages with `release.draft = true`, the command also uploads the
      # assets built here and publishes the GitHub release:
      #   gh release upload "$VERWALTER_TAG" dist/* --clobber
      #   gh release edit "$VERWALTER_TAG" --draft=false
      # cargo, pip and pub keep pre-releases away from default resolution
      # by the version alone. npm does not: publish an rc with a dist-tag
      # (`--tag next` when VERWALTER_PRERELEASE is true).
      - uses: livekit/verwalter@v0.22.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: publish
          releases: ${{ needs.release.outputs.releases }}

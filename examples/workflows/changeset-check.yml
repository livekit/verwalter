# Fails a contributor PR that changes a versioned package without a
# changeset, with a comment that links to a prefilled changeset file.
# The `internal` label (config: [check] exempt_label) skips the check.
# With `[check].api` in verwalter.toml, use steps of your own instead of
# the shared workflow: docs/api-check.md shows them.
name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

jobs:
  check:
    permissions:
      contents: read
      pull-requests: write
    uses: livekit/verwalter/.github/workflows/call-check.yml@v0.22.0

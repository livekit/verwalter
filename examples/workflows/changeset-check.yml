# Fails a contributor PR that changes a versioned package without a
# changeset, with a comment that links to a prefilled changeset file.
# The `internal` label (config: exempt_label) skips the check.
# With `[check].api` in verwalter.toml, the same run checks the public
# API of each covered package against its changeset level. The tool it
# names must be installed first, and the baseline tag must be in the
# checkout.
name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # the API check needs the baseline tag
      - uses: taiki-e/install-action@v2   # only with [check].api
        with:
          tool: cargo-semver-checks
      - uses: lukasIO/verwalter@v0.16.0
        with:
          command: check

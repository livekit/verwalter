# On demand: open an rc PR from the branch the workflow is run on. With
# no package, every package with a pending changeset is in it. With one,
# that package, its fixed group and every in-repo dependency with a
# pending changeset, pinned to each other. The level comes from the
# pending changesets unless given. Merging the PR
# tags 1.6.0-rc.1; the next run numbers rc.2. Changesets stay pending for
# the final release.
name: Pre-release PR

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to pre-release. Empty takes every package with a pending changeset.
        required: false
        default: ""
      level:
        description: Bump level of the rc. Empty takes the highest level the package's pending changesets name.
        type: choice
        options: ["", patch, minor, major]
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags number the rc
      - uses: lukasIO/verwalter@v0.17.0
        with:
          command: pre-release
          args: ${{ inputs.package }} --target ${{ github.ref_name }} ${{ inputs.level && format('--level {0}', inputs.level) || '' }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

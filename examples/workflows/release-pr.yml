# Keeps one release PR open while changesets are pending. Runs on every
# push to main and regenerates the release branch from main.
name: Release PRs

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prs
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit that added a changeset gives its changelog line the PR and author
      - uses: lukasIO/verwalter@v0.10.0
        with:
          command: pr
          # A token of a GitHub App or PAT lets the release PRs trigger
          # other workflows; the default github.token does not.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

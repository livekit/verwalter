# Keeps one release PR open while changesets are pending. Runs on every
# push to main and regenerates the release branch from main.
name: Release PRs

on:
  push:
    branches: [main]

jobs:
  pr:
    permissions:
      contents: write
      pull-requests: write
    uses: livekit/verwalter/.github/workflows/call-pr.yml@v0.22.0
    # A GitHub App token lets the release PRs trigger CI; the default
    # github.token does not. Without these secrets, github.token is used.
    secrets:
      VERWALTER_RELEASE_CLIENT_ID: ${{ secrets.VERWALTER_RELEASE_CLIENT_ID }}
      VERWALTER_RELEASE_APP_KEY: ${{ secrets.VERWALTER_RELEASE_APP_KEY }}
